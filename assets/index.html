<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>流帖</title>
<style>
:root{--washi:#f4efe4;--paper:#fbf8f1;--sumi:#2b2a28;--usu:#7a756b;--line:#d8cfbd;--shu:#c8402f;--ai:#3a5a78;--matsu:#5d7a4a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--washi);color:var(--sumi);font-family:"Noto Serif JP","Noto Serif CJK JP",serif;font-size:15px;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;user-select:none}
input,select,textarea{font:inherit;font-size:16px;color:var(--sumi);background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:9px 10px;width:100%}
textarea{min-height:64px;resize:vertical}
.num{font-family:"Roboto Mono",monospace;font-variant-numeric:tabular-nums}
#app{display:flex;flex-direction:column;height:100%}
header{padding:10px 14px 8px;border-bottom:2px solid var(--sumi);background:var(--washi)}
.hrow{display:flex;align-items:center;gap:8px}
.title{font-size:20px;font-weight:700;letter-spacing:.15em}
.title i{font-style:normal;color:var(--shu)}
.datenav{margin-left:auto;display:flex;align-items:center;gap:2px}
.datenav button{width:34px;height:34px;font-size:16px;color:var(--usu)}
.datenav .d{width:auto;padding:0 6px;color:var(--sumi);font-weight:700}
.stats{display:flex;gap:14px;margin-top:6px;align-items:baseline}
.stats .big{font-size:26px;font-weight:700;line-height:1}
.stats label{display:block;font-size:10px;color:var(--usu);letter-spacing:.1em}
.stats .sm{font-size:15px;font-weight:700}
main{flex:1;overflow-y:auto;padding-bottom:90px}
nav{display:flex;border-top:1px solid var(--line);background:var(--paper)}
nav button{flex:1;padding:10px 0 12px;font-size:12px;color:var(--usu);letter-spacing:.05em;white-space:nowrap}
nav button.on{color:var(--shu);font-weight:700;box-shadow:inset 0 2px 0 var(--shu)}
.runwrap{position:sticky;top:0;z-index:5}
.runwrap .runbar+.runbar{border-top:1px solid rgba(244,239,228,.3)}
.runbar{background:var(--sumi);color:var(--washi);padding:10px 14px;display:flex;align-items:center;gap:10px}
.runbar .rn{flex:1;min-width:0}
.runbar .rn b{display:block;overflow-wrap:anywhere;line-height:1.35}
body:not(.clip) .runbar .rn{flex:1 1 100%}
body:not(.clip) .runbar .el{margin-right:auto}
body.clip .runbar .rn b,body.clip .task .tn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.runbar .rn span{font-size:11px;opacity:.7}
.runbar .el{font-size:22px;font-weight:700}
.runbar .el.over{color:#ff9b8a}
.runbar button{border:1px solid var(--washi);border-radius:4px;padding:7px 10px;font-size:13px;color:var(--washi)}
.runbar{flex-wrap:wrap}
.runbar button.snapb{flex-basis:100%;border:0;border-top:1px solid rgba(244,239,228,.25);border-radius:0;padding:8px 0 0;font-size:12px;text-align:left;color:#f0c9a8}
.runbar button.estb{border-color:#f0c9a8;color:#f0c9a8}
.runbar button[hidden]{display:none}
body.clip .runbar button{padding:7px 8px}
.runbar button.fin{background:var(--shu);border-color:var(--shu)}
.banner{margin:10px 14px 0;padding:9px 12px;border:1px dashed var(--shu);border-radius:4px;display:flex;align-items:center;gap:8px;font-size:13px}
.banner button{margin-left:auto;color:var(--shu);font-weight:700;white-space:nowrap}
.sec.tap{cursor:pointer;user-select:none}
.sec .chev{font-style:normal;color:var(--usu);font-size:12px;width:12px;align-self:center}
.sec{display:flex;align-items:baseline;gap:8px;padding:14px 14px 4px;border-bottom:1px solid var(--line)}
.sec b{font-size:14px;letter-spacing:.2em}
.sec span{font-size:11px;color:var(--usu)}
.sec .r{margin-left:auto}
.sec.now b{color:var(--shu)}
.task{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid #e6dfcf}
.task .go{flex:none;width:36px;height:36px;border-radius:50%;border:1.5px solid var(--sumi);font-size:13px;display:grid;place-items:center}
.task.done .go{border-color:var(--line);color:var(--usu)}
.task.run{background:#f9e9e3}
.task.run .go{background:var(--shu);border-color:var(--shu);color:#fff}
.task .tb{flex:1;min-width:0}
.task .tn{overflow-wrap:anywhere;line-height:1.4}
.task.done .tn{color:var(--usu)}
.task .tm{font-size:11px;color:var(--usu);margin-top:2px;display:flex;gap:6px;align-items:center}
.pj{display:inline-block;padding:0 6px;border-radius:2px;color:#fff;font-size:10px;background:var(--c,var(--ai));font-family:sans-serif}
.md{display:inline-block;padding:0 5px;border-radius:9px;border:1px solid var(--c,var(--usu));color:var(--c,var(--usu));font-size:10px;font-family:sans-serif;line-height:1.5}
.task .tt{flex:none;text-align:right;font-size:11px;color:var(--usu)}
.task .tt b{font-size:16px;color:var(--sumi)}
.task .tt b.over{color:var(--shu)}
.flt{display:flex;gap:6px;padding:10px 14px 2px;overflow-x:auto;white-space:nowrap;margin:0}
.flt button{flex:none}
.flt .sp{flex:1;min-width:6px}
.flt button.tg.on{background:var(--shu);border-color:var(--shu)}
.hd{flex:none;width:36px;height:40px;font-size:20px;color:var(--usu);touch-action:none}
.arr{flex:none;display:flex;gap:5px}
.arr button{width:36px;height:36px;border:1px solid var(--line);border-radius:4px;background:var(--paper);font-size:15px}
.task.drag{opacity:.35}
.task.dropb{box-shadow:inset 0 3px 0 var(--shu)}
.task.dropa{box-shadow:inset 0 -3px 0 var(--shu)}
.empty{padding:40px 20px;text-align:center;color:var(--usu);line-height:2}
.fab{position:fixed;right:18px;bottom:68px;width:56px;height:56px;border-radius:50%;background:var(--shu);color:#fff;font-size:30px;line-height:1;box-shadow:0 3px 8px rgba(0,0,0,.3);z-index:6}
.pad{padding:14px}
h2{font-size:15px;letter-spacing:.2em;margin:18px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--sumi)}
h2:first-child{margin-top:0}
.card{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.card .cb{flex:1;min-width:0}
.card small{color:var(--usu);display:block;margin-top:2px}
.card.off .cb{opacity:.5}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;align-self:center}
.sw{flex:none;position:relative;width:46px;height:26px}
.sw input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;padding:0;z-index:1}
.sw span{position:absolute;inset:0;border-radius:13px;background:var(--line);transition:background .15s}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.sw input:checked+span{background:var(--shu)}
.sw input:checked+span::after{left:23px}
.btn{display:inline-block;border:1px solid var(--sumi);border-radius:4px;padding:9px 14px;font-size:14px;background:var(--paper)}
.btn.pri{background:var(--shu);border-color:var(--shu);color:#fff;font-weight:700}
.btn.dan{border-color:var(--shu);color:var(--shu)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.seg{display:flex;border:1px solid var(--sumi);border-radius:4px;overflow:hidden;margin-bottom:12px}
.seg button{flex:1;padding:8px 0;font-size:13px}
.seg button.on{background:var(--sumi);color:var(--washi)}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi div{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:8px;text-align:center}
.kpi b{display:block;font-size:20px}
.kpi span{font-size:10px;color:var(--usu)}
.bar{margin:7px 0}
.bar .bl{display:flex;font-size:13px}
.bar .bl span{margin-left:auto;color:var(--usu);font-size:12px}
.bar .bt{height:8px;background:#e6dfcf;border-radius:2px;margin-top:3px;overflow:hidden}
.bar .bt i{display:block;height:100%;background:var(--c,var(--ai))}
.days{display:flex;align-items:flex-end;gap:2px;height:90px;margin-top:6px}
.days div{flex:1;background:var(--ai);min-height:1px;border-radius:1px 1px 0 0}
.days div.t{background:var(--shu)}
.ovl{position:fixed;inset:0;background:rgba(43,42,40,.45);z-index:20;display:none;align-items:flex-end}
.ovl.on{display:flex}
.sheet{background:var(--washi);width:100%;max-height:92%;overflow-y:auto;border-radius:12px 12px 0 0;padding:16px 16px 22px;border-top:3px solid var(--shu)}
.sheet h3{margin:0 0 12px;font-size:16px;letter-spacing:.15em}
.f{margin-bottom:11px}
.f>label{display:block;font-size:11px;color:var(--usu);margin-bottom:3px;letter-spacing:.1em}
.row{display:flex;gap:8px}
.row>*{flex:1;min-width:0}
.chips{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);border-radius:14px;padding:4px 11px;font-size:13px;background:var(--paper)}
.chips button.on{background:var(--sumi);color:var(--washi);border-color:var(--sumi)}
.chk{display:flex;align-items:center;gap:8px;font-size:14px}
.f>label.chk{display:flex;font-size:14px;color:var(--sumi);letter-spacing:0}
.chk input{width:20px;height:20px;flex:none}
#ask{align-items:center;justify-content:center;z-index:30}
#ask .box{background:var(--washi);border-radius:8px;padding:18px;width:82%;max-width:340px;border-top:3px solid var(--shu)}
#ask p{margin:0 0 14px;line-height:1.7}
#toast{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);background:var(--sumi);color:var(--washi);padding:8px 16px;border-radius:18px;font-size:13px;z-index:40;opacity:0;transition:opacity .25s;pointer-events:none;width:max-content;max-width:86vw;text-align:center;line-height:1.5}
#toast.on{opacity:.95}
.srow{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.srow input[type=time]{width:120px;flex:none}
.srow input[type=color]{width:46px;height:42px;padding:2px;flex:none}
.srow button{flex:none;width:34px;height:40px;color:var(--shu);font-size:18px}
.hint{font-size:12px;color:var(--usu);line-height:1.7}
</style>
</head>
<body>
<div id="app">
  <header id="hd"></header>
  <main id="mn"></main>
  <nav id="nv"></nav>
</div>
<button class="fab" id="fab" data-act="add">＋</button>
<div class="ovl" id="ovl"><div class="sheet" id="sheet"></div></div>
<div class="ovl" id="ask"><div class="box"><p id="askmsg"></p><div class="btns" style="justify-content:flex-end;margin:0"><button class="btn" data-act="askno">やめる</button><button class="btn pri" data-act="askyes">はい</button></div></div></div>
<div id="toast"></div>
<input type="file" id="file" accept=".json,application/json" style="display:none">
<input type="file" id="ifile" accept=".md,.markdown,.csv,.tsv,.txt,text/*" style="display:none">
<script>
'use strict';
const KEY='nagarecho.v1';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const WD=['日','月','火','水','木','金','土'];

function defaults(){return{v:1,
  settings:{dayStart:4,sections:[
    {id:'s1',name:'朝',start:'04:00'},{id:'s2',name:'午前',start:'08:00'},{id:'s3',name:'午後',start:'12:00'},
    {id:'s4',name:'夕方',start:'16:00'},{id:'s5',name:'夜',start:'20:00'},{id:'s6',name:'深夜',start:'00:00'}]},
  projects:[{id:'p1',name:'生活',color:'#3a5a78'},{id:'p2',name:'家事',color:'#5d7a4a'},{id:'p3',name:'制作',color:'#c8402f'}],
  modes:defModes(),routines:[],inbox:[],days:{},runs:[]};}
function defModes(){return[{id:'m1',name:'集中',color:'#c8402f'},{id:'m2',name:'作業',color:'#3a5a78'},{id:'m3',name:'雑務',color:'#8a6d3b'},{id:'m4',name:'休息',color:'#5d7a4a'}];}
function fixRuns(j){if(!j.runs)j.runs=j.running?[j.running]:[];delete j.running;}
function load(){try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&j.days&&j.settings){if(!j.modes)j.modes=defModes();if(!j.inbox)j.inbox=[];fixRuns(j);return j;}}catch(e){}return defaults();}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));localStorage.setItem(KEY+'.dirty','1');}catch(e){toast('保存に失敗しました');}}

/* ---------- 日付・時刻 ---------- */
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dstr(new Date(Date.now()-S.settings.dayStart*3600e3));
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return dstr(d);};
const dow=s=>new Date(s+'T12:00:00').getDay();
const hm=ts=>{const d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes());};
const dur=m=>{m=Math.round(m);return m<60?m+'分':Math.floor(m/60)+':'+pad(m%60);};
const hms=ms=>{const s=Math.max(0,Math.floor(ms/1000));return Math.floor(s/3600)+':'+pad(Math.floor(s/60)%60)+':'+pad(s%60);};
const mins=s=>{const a=s.split(':');return +a[0]*60+ +a[1];};
function tsFor(date,t){const a=t.split(':').map(Number);const d=new Date(date+'T00:00:00');d.setHours(a[0],a[1],0,0);if(a[0]<S.settings.dayStart)d.setDate(d.getDate()+1);return d.getTime();}
const act=t=>t.start&&t.end?Math.max(0,Math.round((t.end-t.start)/60000)):0;

/* ---------- セクション ---------- */
function secs(){const b=S.settings.dayStart*60;return S.settings.sections.slice().sort((x,y)=>((mins(x.start)-b+1440)%1440)-((mins(y.start)-b+1440)%1440));}
function secAt(ts){const d=new Date(ts),m=d.getHours()*60+d.getMinutes();const a=S.settings.sections.slice().sort((x,y)=>mins(x.start)-mins(y.start));let r=a[a.length-1];for(const s of a)if(mins(s.start)<=m)r=s;return r;}
const secIdx=id=>{const i=secs().findIndex(s=>s.id===id);return i<0?0:i;};
const proj=id=>S.projects.find(p=>p.id===id);
const mode=id=>S.modes.find(m=>m.id===id);

/* ---------- 日データ ---------- */
function applies(r,date){const w=dow(date);if(!r.active)return false;if(r.type==='daily')return true;if(r.type==='weekdays')return w>=1&&w<=5;return (r.days||[]).includes(w);}
function ensureDay(date){let day=S.days[date];let ch=false;
  if(date>=today()){for(const r of S.routines){if(!applies(r,date))continue;if(!day){day=S.days[date]={tasks:[],rdone:[]};}
    if(day.rdone.includes(r.id))continue;day.rdone.push(r.id);
    day.tasks.push({id:uid(),name:r.name,est:r.est,projectId:r.projectId,modeId:r.modeId||'',section:r.section,start:null,end:null,note:'',routineId:r.id,order:nextOrder(day)});ch=true;}}
  if(ch)save();return day||{tasks:[],rdone:[]};}
function dayW(date){if(!S.days[date])S.days[date]={tasks:[],rdone:[]};return S.days[date];}
function nextOrder(day){return day.tasks.reduce((m,t)=>Math.max(m,t.order||0),0)+1;}
function sorted(day){return day.tasks.slice().sort((a,b)=>{const s=secIdx(a.section)-secIdx(b.section);if(s)return s;
  const ka=a.start?0:1,kb=b.start?0:1;if(ka!==kb)return ka-kb;return ka===0?a.start-b.start:(a.order||0)-(b.order||0);});}
function findTask(date,id){const d=S.days[date];return d?d.tasks.find(t=>t.id===id):null;}
// 実行中タスクの一覧（開始が古い順）。無効になった参照はここで取り除く
function runs(){const out=[];for(const r of S.runs){const t=findTask(r.date,r.id);if(t&&t.start&&!t.end)out.push({date:r.date,id:r.id,t});}
  if(out.length!==S.runs.length)S.runs=out.map(r=>({date:r.date,id:r.id}));return out.sort((a,b)=>a.t.start-b.t.start);}
function runTask(){const r=runs();return r.length?r[r.length-1].t:null;}

/* ---------- 操作 ---------- */
// 今日（論理日）の中で、直近に終了したタスクの終了時刻。なければ0
function prevEnd(exId){const td=today(),base=new Date(td+'T00:00:00');base.setHours(S.settings.dayStart,0,0,0);const lo=base.getTime(),now=Date.now();let m=0;
  for(const d of [td,addDays(td,-1)]){const day=S.days[d];if(day)for(const t of day.tasks)if(t.id!==exId&&t.end&&t.end>=lo&&t.end<=now&&t.end>m)m=t.end;}return m;}
function startTask(date,id,fromPrev){let now=Date.now();const cur=runs().length>0;if(cur&&!S.settings.multi){for(const r of runs())r.t.end=now;S.runs=[];}
  if(fromPrev===undefined)fromPrev=!!S.settings.startFromPrev;
  if(!cur&&fromPrev){const pe=prevEnd(id);if(pe&&pe<now){now=pe;toast(hm(pe)+' から開始（前タスクの終了時刻）');}}
  let t=findTask(date,id);if(!t)return;const td=today();
  if(date!==td){S.days[date].tasks=S.days[date].tasks.filter(x=>x!==t);dayW(td).tasks.push(t);date=td;}
  t.start=now;t.end=null;t.section=secAt(now).id;S.runs.push({date,id:t.id});save();render();}
function pickRun(id){const rs=runs();const r=id?rs.find(x=>x.id===id):rs[rs.length-1];return r?r.t:null;}
function finishRun(id){const t=pickRun(id);if(!t)return;t.end=Date.now();S.runs=S.runs.filter(x=>x.id!==t.id);save();render();toast('完了　'+dur(act(t)));}
// 終了時刻を「開始＋見積」にして完了する（現在時刻より後にはしない）
function finishEst(id){const t=pickRun(id);if(!t)return;const e=Math.min(Date.now(),t.start+(t.est||0)*60000);t.end=Math.max(t.start,e);S.runs=S.runs.filter(x=>x.id!==t.id);save();render();toast('見積通りに完了　'+hm(t.start)+'–'+hm(t.end)+'（'+dur(act(t))+'）');}
function pauseRun(id){const t=pickRun(id);if(!t)return;t.end=Date.now();S.runs=S.runs.filter(x=>x.id!==t.id);
  const d=dayW(today());const minO=d.tasks.reduce((m,x)=>Math.min(m,x.order||0),0);
  d.tasks.push({id:uid(),name:t.name,est:Math.max(1,(t.est||0)-act(t)),projectId:t.projectId,modeId:t.modeId||'',section:secAt(Date.now()).id,start:null,end:null,note:t.note||'',routineId:null,order:minO-1});
  save();render();toast('中断しました（残りを未着手に戻しました）');}
function move(date,id,dir){const day=S.days[date];const list=sorted(day).filter(t=>!t.start);const i=list.findIndex(t=>t.id===id);if(i<0)return;const t=list[i],n=list[i+dir];const ss=secs(),si=secIdx(t.section);
  if(n&&n.section===t.section){const o=t.order;t.order=n.order;n.order=o;if(t.order===n.order)t.order+=dir;}
  else if(ss[si+dir]){t.section=ss[si+dir].id;t.order=dir<0?nextOrder(day):day.tasks.reduce((m,x)=>Math.min(m,x.order||0),0)-1;}
  save();}

/* ---------- 描画 ---------- */
let tab='today',view=today(),range='7';
let sortMode=false,drag=null;
let ui={sec:'',hideDone:false};try{Object.assign(ui,JSON.parse(localStorage.getItem(KEY+'.ui'))||{});}catch(e){}
const saveUi=()=>{try{localStorage.setItem(KEY+'.ui',JSON.stringify(ui));}catch(e){}};
function render(){if(view<'2000')view=today();document.body.classList.toggle('clip',S.settings.wrap===false);renderHead();renderNav();
  ({today:renderToday,inbox:renderInbox,routine:renderRoutine,review:renderReview,setting:renderSetting})[tab]();
  $('fab').style.display=(tab==='today'||tab==='routine'||tab==='inbox')?'':'none';}
function renderNav(){const T=[['today','今日'],['inbox','やること'],['routine','ルーチン'],['review','ふりかえり'],['setting','設定']];
  $('nv').innerHTML=T.map(t=>`<button data-act="tab" data-t="${t[0]}" class="${tab===t[0]?'on':''}">${t[1]}</button>`).join('');}
function calc(){const day=ensureDay(view);const now=Date.now();const rs=runs();const isT=view===today();
  let rest=0,done=0;for(const t of day.tasks){if(!t.start)rest+=t.est||0;else if(t.end)done+=act(t);}

  let h=`<div class="pad" style="padding-bottom:0"><div class="seg">${[['sec','セクション別'],['mode','モード別'],['prj','プロジェクト別']].map(x=>`<button data-act="rgroup" data-g="${x[0]}" class="${g===x[0]?'on':''}">${x[1]}</button>`).join('')}</div>
   <div class="kpi"><div><b class="num">${act.length}</b><span>有効</span></div><div><b class="num">${S.routines.length-act.length}</b><span>停止中</span></div><div><b class="num">${dur(tsum)}</b><span>今日の分の見積</span></div></div>
   <div class="chips" style="margin-top:10px"><button data-act="rhide" class="tg ${ui.rhide?'on':''}">${ui.rhide?'停止中を表示':'停止中を隠す'}</button></div></div>`;
  if(!S.routines.length)h+='<div class="empty">ルーチンはまだありません。<br>右下の「＋」から追加してください。</div>';
  // グループの一覧（見出し名・色・絞り込み条件）
  let groups;
  if(g==='sec')groups=ss.map(x=>({name:x.name,sub:x.start+'〜',f:r=>secIdx(r.section)===secIdx(x.id)}));
  else{const src=g==='mode'?S.modes:S.projects,key=g==='mode'?'modeId':'projectId';
    groups=src.map(x=>({name:x.name,color:x.color,f:r=>r[key]===x.id}));groups.push({name:'（なし）',color:'#7a756b',f:r=>!src.some(x=>x.id===r[key])});}
  for(const gr of groups){let rs=S.routines.filter(gr.f);if(ui.rhide)rs=rs.filter(r=>r.active);if(!rs.length)continue;
    rs.sort((a,b)=>secIdx(a.section)-secIdx(b.section)||a.name.localeCompare(b.name,'ja'));
    const e=rs.filter(r=>r.active).reduce((m,r)=>m+(r.est||0),0);
    h+=`<div class="sec">${gr.color?`<i class="dot" style="background:${esc(gr.color)}"></i>`:''}<b>${esc(gr.name)}</b>${gr.sub?`<span class="num">${gr.sub}</span>`:''}<span class="r num">${rs.length}件・${dur(e)}</span></div><div class="pad" style="padding-top:8px;padding-bottom:0">`;
    for(const r of rs){const p=proj(r.projectId),mo=mode(r.modeId),sc=ss[secIdx(r.section)];
      const bits=[];if(g!=='sec'&&sc)bits.push(esc(sc.name));bits.push(repLabel(r),(r.est||0)+'分');
      h+=`<div class="card ${r.active?'':'off'}"><div class="cb" data-act="redit" data-id="${r.id}"><b>${esc(r.name)}</b><small>${bits.join('・')}${r.active?'':'・停止中'}</small>
       <div class="tm" style="margin-top:4px;display:flex;gap:6px">${g!=='prj'&&p?`<span class="pj" style="--c:${esc(p.color)}">${esc(p.name)}</span>`:''}${g!=='mode'&&mo?`<span class="md" style="--c:${esc(mo.color)}">${esc(mo.name)}</span>`:''}</div></div>
       <label class="sw"><input type="checkbox" data-rt="${r.id}" ${r.active?'checked':''}><span></span></label></div>`;}
    h+='</div>';}
  $('mn').innerHTML=h;}
function rangeDates(){if(range==='1')return[view];const n=+range,td=today(),a=[];for(let i=n-1;i>=0;i--)a.push(addDays(td,-i));return a;}
function renderReview(){const ds=rangeDates();let tot=0,est=0,cnt=0;const bp={},bm={},bn={},bd=[];
  for(const d of ds){let m=0;const day=S.days[d];if(day)for(const t of day.tasks){if(!(t.start&&t.end))continue;const a=act(t);tot+=a;est+=t.est||0;cnt++;m+=a;
    const k=t.projectId&&proj(t.projectId)?t.projectId:'';bp[k]=(bp[k]||0)+a;const km=t.modeId&&mode(t.modeId)?t.modeId:'';bm[km]=(bm[km]||0)+a;bn[t.name]=(bn[t.name]||0)+a;}bd.push([d,m]);}
  let h=`<div class="pad"><div class="seg">${[['1',view.slice(5).replace('-','/')],['7','7日間'],['30','30日間']].map(r=>`<button data-act="range" data-r="${r[0]}" class="${range===r[0]?'on':''}">${r[1]}</button>`).join('')}</div>
   <div class="kpi"><div><b class="num">${dur(tot)}</b><span>実績合計</span></div><div><b class="num">${cnt}</b><span>完了タスク</span></div><div><b class="num">${est?Math.round(tot/est*100)+'%':'–'}</b><span>実績/見積</span></div></div>`;
  if(ds.length>1){const mx=Math.max(1,...bd.map(x=>x[1]));h+=`<h2>日ごとの記録時間</h2><div class="days">${bd.map(x=>`<div class="${x[0]===today()?'t':''}" style="height:${x[1]/mx*100}%"></div>`).join('')}</div><p class="hint">1日平均 ${dur(tot/ds.length)}</p>`;}
  h+='<h2>プロジェクト別</h2>';const ks=Object.keys(bp).sort((a,b)=>bp[b]-bp[a]);if(!ks.length)h+='<p class="hint">この期間の記録はありません。</p>';
  for(const k of ks){const p=proj(k);h+=`<div class="bar"><div class="bl">${p?esc(p.name):'（なし）'}<span class="num">${dur(bp[k])}・${Math.round(bp[k]/tot*100)||0}%</span></div><div class="bt"><i style="width:${bp[k]/Math.max(1,tot)*100}%;--c:${p?esc(p.color):'#7a756b'}"></i></div></div>`;}
  const ms=Object.keys(bm).sort((a,b)=>bm[b]-bm[a]);if(ms.length){h+='<h2>モード別</h2>';for(const k of ms){const p=mode(k);h+=`<div class="bar"><div class="bl">${p?esc(p.name):'（なし）'}<span class="num">${dur(bm[k])}・${Math.round(bm[k]/tot*100)||0}%</span></div><div class="bt"><i style="width:${bm[k]/Math.max(1,tot)*100}%;--c:${p?esc(p.color):'#7a756b'}"></i></div></div>`;}}
  const ns=Object.keys(bn).sort((a,b)=>bn[b]-bn[a]).slice(0,8);if(ns.length){h+='<h2>時間を使ったタスク</h2>';for(const n of ns)h+=`<div class="bar"><div class="bl">${esc(n)}<span class="num">${dur(bn[n])}</span></div><div class="bt"><i style="width:${bn[n]/bn[ns[0]]*100}%"></i></div></div>`;}
  h+=`<h2>書き出し（${view}）</h2><p class="hint">Obsidianのデイリーノートに貼れるMarkdownです。</p><div class="btns"><button class="btn pri" data-act="mdshare">共有</button><button class="btn" data-act="mdcopy">コピー</button><button class="btn" data-act="mdsave">.mdで保存</button></div></div>`;
  $('mn').innerHTML=h;}
function driveHtml(){if(!(window.Android&&Android.linkName))return '<p class="hint">Androidアプリ版で使えます。</p>';
  const n=Android.linkName(),ts=+localStorage.getItem(KEY+'.sync')||0;
  if(!n)return `<p class="hint">全データ（バックアップJSON）をGoogleドライブの1つのファイルに保存します。「保存先を選ぶ」を押し、開いた画面の左上メニューから「ドライブ」を選んで保存してください。次回からは同じファイルに上書きします。</p><div class="btns"><button class="btn pri" data-act="drvlink">保存先を選ぶ</button></div>`;

  <div class="f"><label class="chk"><input type="checkbox" id="autoSync" ${S.settings.autoSync!==false?'checked':''}>アプリを閉じるときに自動で保存する</label></div>
  <div class="btns"><button class="btn pri" data-act="drvsave">今すぐ保存</button><button class="btn" data-act="drvlink">保存先を変更</button><button class="btn" data-act="drvunlink">連携を解除</button></div>

   ${(st.cals||[]).map(c=>`<div class="f"><label class="chk"><input type="checkbox" data-cal="${esc(c.id)}" ${(st.calSkip||[]).includes(c.id)?'':'checked'}>${esc(c.name)}${c.account&&c.account!==c.name?`<small style="color:var(--usu)">　${esc(c.account)}</small>`:''}</label></div>`).join('')}
   <div class="btns"><button class="btn" data-act="callist">${(st.cals||[]).length?'カレンダー一覧を更新':'カレンダー一覧を読み込む'}</button></div>`:'<p class="hint">Androidアプリ版で使えます。</p>'}
  <h2>Googleドライブ</h2>${driveHtml()}

  <div class="btns"><button class="btn dan" data-act="wipe">すべて消去</button></div><p class="hint">流帖 1.12</p></div>`;

function openSheet(h){$('sheet').innerHTML=h;$('ovl').classList.add('on');}
function closeSheet(){$('ovl').classList.remove('on');$('sheet').innerHTML='';}
let askCb=null;function ask(msg,cb){$('askmsg').textContent=msg;askCb=cb;$('ask').classList.add('on');}
let tt;function toast(m){const e=$('toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2200);}
const prjOpts=sel=>`<option value="">（なし）</option>`+S.projects.map(p=>`<option value="${p.id}" ${p.id===sel?'selected':''}>${esc(p.name)}</option>`).join('');
const modeOpts=sel=>`<option value="">（なし）</option>`+S.modes.map(p=>`<option value="${p.id}" ${p.id===sel?'selected':''}>${esc(p.name)}</option>`).join('');
const cls=(p,m,sc)=>`<div class="row"><div class="f"><label>プロジェクト</label><select id="f_prj">${prjOpts(p)}</select></div><div class="f"><label>モード</label><select id="f_mode">${modeOpts(m)}</select></div></div><div class="f"><label>セクション</label><select id="f_sec">${secOpts(sc)}</select></div>`;
const secOpts=sel=>secs().map(s=>`<option value="${s.id}" ${s.id===sel?'selected':''}>${esc(s.name)}（${s.start}〜）</option>`).join('');
const estField=v=>`<div class="f"><label>見積（分）</label><input id="f_est" type="number" inputmode="numeric" min="0" value="${v}"><div class="chips">${[5,10,15,30,45,60,90].map(n=>`<button data-act="chip" data-v="${n}" class="${n===v?'on':''}">${n}</button>`).join('')}</div></div>`;
function addSheet(){const isT=view===today();
  openSheet(`<h3>タスクを追加</h3><div class="f"><label>タスク名</label><input id="f_name" placeholder="例：洗濯物をたたむ" enterkeyhint="done"></div>${estField(15)}
  ${cls('','',ui.sec||(isT?secAt(Date.now()).id:secs()[0].id))}
  ${isT?'<div class="f"><label class="chk"><input type="checkbox" id="f_now">いますぐ開始する（割り込み）</label></div>':''}
  <div class="btns"><button class="btn pri" data-act="addsave">追加</button><button class="btn" data-act="close">閉じる</button></div>`);
  setTimeout(()=>{const e=$('f_name');if(e)e.focus();},60);}
function editSheet(id){const t=findTask(view,id);if(!t)return;const st=t.start?(t.end?'done':'run'):'todo';
  let h=`<h3>タスクの編集</h3><input type="hidden" id="f_id" value="${t.id}"><div class="f"><label>タスク名</label><input id="f_name" value="${esc(t.name)}"></div>${estField(t.est||0)}
  ${cls(t.projectId,t.modeId,t.section)}`;
  if(st!=='todo')h+=`<div class="row"><div class="f"><label>開始</label><input type="time" id="f_st" value="${hm(t.start)}"></div><div class="f"><label>終了</label><input type="time" id="f_en" value="${t.end?hm(t.end):''}" ${st==='run'?'disabled':''}></div></div>`;
  h+=`<div class="f"><label>メモ</label><textarea id="f_note">${esc(t.note||'')}</textarea></div><div class="btns"><button class="btn pri" data-act="editsave">保存</button><button class="btn" data-act="close">閉じる</button></div><div class="btns">`;
  if(st==='todo'&&view===today()&&!runs().length){const pe=prevEnd(t.id);if(pe)h+=`<button class="btn" data-act="startprev">▶ 前タスク終了（${hm(pe)}）から開始</button>`;}
  if(st==='todo')h+=`<button class="btn" data-act="mv" data-d="-1">↑ 上へ</button><button class="btn" data-act="mv" data-d="1">↓ 下へ</button><button class="btn" data-act="tomorrow">翌日へ送る</button><button class="btn" data-act="toinbox">やることへ戻す</button>`;
  if(st!=='todo'&&t.est&&(st==='run'?Date.now()-t.start>=t.est*60000:act(t)!==t.est))h+=`<button class="btn" data-act="endest">⏱ 終了を見積通り（${hm(t.start+t.est*60000)}）にする</button>`;
  if(st==='done')h+=`<button class="btn" data-act="redo">もう一度やる</button><button class="btn" data-act="unstart">未着手に戻す</button>`;
  if(!t.routineId)h+=`<button class="btn" data-act="mkroutine">ルーチンにする</button>`;
  h+=`<button class="btn dan" data-act="del">削除</button></div>`;openSheet(h);}
function routineSheet(id){const r=id?S.routines.find(x=>x.id===id):{id:'',name:'',est:15,projectId:'',modeId:'',section:secs()[0].id,type:'daily',days:[],active:true};if(!r)return;

   <div class="chips" id="f_days">${WD.map((w,i)=>`<button data-act="wd" data-v="${i}" class="${(r.days||[]).includes(i)?'on':''}">${w}</button>`).join('')}</div></div>

const formVals=()=>({name:$('f_name').value.trim(),est:Math.max(0,Math.round(+$('f_est').value||0)),projectId:$('f_prj').value,modeId:$('f_mode').value,section:$('f_sec').value});

function markdown(date){const day=S.days[date]||{tasks:[]};const list=sorted(day);const dn=list.filter(t=>t.start&&t.end),td=list.filter(t=>!t.start);
  const ta=dn.reduce((m,t)=>m+act(t),0),te=dn.reduce((m,t)=>m+(t.est||0),0);
  let s=`## 流帖 ${date}（${WD[dow(date)]}）\n\n- 実績合計: ${dur(ta)} ／ 見積合計: ${dur(te)} ／ 完了: ${dn.length}件\n\n`;
  if(dn.length){s+='| 開始 | 終了 | 実績(分) | 見積(分) | タスク | PRJ | モード | メモ |\n|---|---|---:|---:|---|---|---|---|\n';
    for(const t of dn){const p=proj(t.projectId),mo=mode(t.modeId);s+=`| ${hm(t.start)} | ${hm(t.end)} | ${act(t)} | ${t.est||0} | ${t.name.replace(/\|/g,'｜')} | ${p?p.name:''} | ${mo?mo.name:''} | ${(t.note||'').replace(/\n/g,' ').replace(/\|/g,'｜')} |\n`;}}
  if(td.length){s+='\n### 未完了\n';for(const t of td)s+=`- [ ] ${t.name}（${t.est||0}分）\n`;}return s;}
function csv(){const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';let s='﻿日付,セクション,タスク,プロジェクト,モード,見積(分),開始,終了,実績(分),メモ\n';
  for(const d of Object.keys(S.days).sort())for(const t of sorted(S.days[d])){const p=proj(t.projectId),mo=mode(t.modeId),sc=S.settings.sections.find(x=>x.id===t.section);
    s+=[d,sc?sc.name:'',t.name,p?p.name:'',mo?mo.name:'',t.est||0,t.start?hm(t.start):'',t.end?hm(t.end):'',t.start&&t.end?act(t):'',t.note||''].map(q).join(',')+'\n';}return s;}
function saveFile(name,mime,text){if(window.Android&&Android.saveFile){Android.saveFile(name,mime,text);return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:mime}));a.download=name;a.click();}
function copy(text){if(window.Android&&Android.copy){Android.copy(text);toast('コピーしました');return;}
  const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('コピーしました');}catch(e){}ta.remove();}

 close(){closeSheet();},
 chip(d,el){$('f_est').value=d.v;el.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===el));},

  const t=Object.assign({id:uid(),start:null,end:null,note:'',routineId:null,order:nextOrder(day)},v);day.tasks.push(t);

 calimport(){calAsk('import');},
 callist(){calAsk('list');},
 calsave(){const pick=[...$('sheet').querySelectorAll('[data-ce]')].filter(x=>x.checked).map(x=>calEvs[+x.dataset.ce]);if(!pick.length){toast('予定が選ばれていません');return;}
  const day=dayW(view);if(!day.cal)day.cal=[];
  for(const e of pick){day.tasks.push({id:uid(),name:e.title||'（無題の予定）',est:Math.max(1,Math.round((e.end-e.begin)/60000)),projectId:'',modeId:'',section:secAt(e.begin).id,start:null,end:null,
    note:'予定 '+hm(e.begin)+'–'+hm(e.end)+(e.calName?'（'+e.calName+'）':''),routineId:null,order:nextOrder(day),calBegin:e.begin});if(!day.cal.includes(calKey(e)))day.cal.push(calKey(e));}
  save();closeSheet();render();toast(pick.length+'件の予定を取り込みました');},
 ibulk(){bulkSheet();},
 ibulkfile(){$('ifile').value='';$('ifile').click();},
 ibulksave(){const items=parseBulk($('f_bulk').value);if(!items.length){toast('登録できる行がありません');return;}
  const PAL=['#3a5a78','#5d7a4a','#c8402f','#8a6d3b','#6b5b95','#2f7f7a'];
  const idOf=(list,name)=>{if(!name)return '';let x=list.find(p=>p.name===name);if(!x){x={id:uid(),name,color:PAL[list.length%PAL.length]};list.push(x);}return x.id;};
  let o=S.inbox.reduce((m,x)=>Math.max(m,x.order||0),0);
  for(const i of items)S.inbox.push({id:uid(),name:i.name,est:i.est!=null?i.est:15,projectId:idOf(S.projects,i.prj),modeId:idOf(S.modes,i.mode),note:i.note||'',keep:!!i.keep,order:++o});
  save();closeSheet();render();toast(items.length+'件を登録しました');},
 isave(){const name=$('f_name').value.trim();if(!name){toast('タスク名を入れてください');return;}
  const v={name,est:Math.max(0,Math.round(+$('f_est').value||0)),projectId:$('f_prj').value,modeId:$('f_mode').value,note:$('f_note').value,keep:$('f_keep').checked};const id=$('f_id').value;
  if(id)Object.assign(S.inbox.find(x=>x.id===id),v);else S.inbox.push(Object.assign({id:uid(),order:S.inbox.reduce((m,x)=>Math.max(m,x.order||0),0)+1},v));save();closeSheet();render();},
 istart(d){const t=fromInbox(d.id);if(!t)return;save();view=today();tab='today';startTask(view,t.id);$('mn').scrollTop=0;},
 itoday(){const t=fromInbox($('f_id').value);if(!t)return;save();closeSheet();render();toast('今日のリストに追加しました');},
 imv(d){const l=inboxSorted(),i=l.findIndex(x=>x.id===$('f_id').value),j=i+ +d.d;if(i<0||j<0||j>=l.length)return;const x=l[i];l[i]=l[j];l[j]=x;l.forEach((y,n)=>{y.order=n+1;});save();render();toast(+d.d<0?'上へ移動':'下へ移動');},
 idel(){const id=$('f_id').value;ask('この「やること」を削除しますか？',()=>{S.inbox=S.inbox.filter(x=>x.id!==id);save();closeSheet();render();});},
 toinbox(){const id=$('f_id').value,t=findTask(view,id);if(!t)return;S.days[view].tasks=S.days[view].tasks.filter(x=>x!==t);
  S.inbox.push({id:uid(),name:t.name,est:t.est,projectId:t.projectId,modeId:t.modeId||'',note:t.note||'',keep:false,order:S.inbox.reduce((m,x)=>Math.max(m,x.order||0),0)+1});save();closeSheet();render();toast('やることへ戻しました');},
 fsec(d){ui.sec=d.s;saveUi();render();},
 fold(d){const f=new Set(ui.fold||[]);f.has(d.s)?f.delete(d.s):f.add(d.s);ui.fold=[...f];saveUi();const y=$('mn').scrollTop;render();$('mn').scrollTop=y;},
 foldall(){ui.fold=(ui.fold||[]).length?[]:secs().map(x=>x.id);saveUi();render();},
 hidedone(){ui.hideDone=!ui.hideDone;saveUi();render();},
 start(d){startTask(view,d.id);},
 startprev(){const id=$('f_id').value;closeSheet();startTask(view,id,true);},
 snap(){const t=runTask();if(!t)return;const pe=prevEnd(t.id);if(!pe||pe>=t.start)return;t.start=pe;t.section=secAt(pe).id;save();render();toast('開始を '+hm(pe)+' に合わせました');},
 finish(d){finishRun(d.id);},
 finishest(d){finishEst(d.id);},
 endest(){const t=findTask(view,$('f_id').value);if(!t||!t.start)return;if(!t.end){closeSheet();finishEst(t.id);return;}
  const e=t.start+(t.est||0)*60000;if(e>Date.now()){toast('見積通りの終了時刻がまだ来ていません');return;}t.end=e;save();closeSheet();render();toast('終了を '+hm(e)+' にしました（見積通り）');},
 pause(d){pauseRun(d.id);},
 multi(){S.settings.multi=!S.settings.multi;save();render();toast(S.settings.multi?'並行実行ON：実行中のタスクを止めずに別のタスクを開始できます':'並行実行OFF：開始すると実行中のタスクは終了します');},
 edit(d){editSheet(d.id);},
 editsave(){const t=findTask(view,$('f_id').value);if(!t)return;const v=formVals();if(!v.name){toast('タスク名を入れてください');return;}Object.assign(t,v);t.note=$('f_note').value;
  if(t.start&&$('f_st')&&$('f_st').value){t.start=tsFor(view,$('f_st').value);if(t.end&&$('f_en').value){let e=tsFor(view,$('f_en').value);if(e<t.start)e+=864e5;t.end=e;}
   if(!t.end&&t.start>Date.now())t.start=Date.now();}
  save();closeSheet();render();},
 mv(d){move(view,$('f_id').value,+d.d);render();toast(+d.d<0?'上へ移動':'下へ移動');},
 tomorrow(){const id=$('f_id').value,t=findTask(view,id);if(!t)return;const nx=addDays(view,1);S.days[view].tasks=S.days[view].tasks.filter(x=>x!==t);const nd=dayW(nx);t.order=nextOrder(nd);nd.tasks.push(t);save();closeSheet();render();toast('翌日へ送りました');},
 redo(){const t=findTask(view,$('f_id').value);if(!t)return;const td=today(),d=dayW(td);d.tasks.push({id:uid(),name:t.name,est:t.est,projectId:t.projectId,modeId:t.modeId||'',section:secAt(Date.now()).id,start:null,end:null,note:'',routineId:null,order:nextOrder(d)});save();closeSheet();view=td;render();toast('今日に追加しました');},
 unstart(){const t=findTask(view,$('f_id').value);if(!t)return;t.start=null;t.end=null;save();closeSheet();render();},
 mkroutine(){const t=findTask(view,$('f_id').value);if(!t)return;const r={id:uid(),name:t.name,est:t.est,projectId:t.projectId,modeId:t.modeId||'',section:t.section,type:'daily',days:[],active:true};S.routines.push(r);t.routineId=r.id;
  dayW(view).rdone.push(r.id);save();closeSheet();render();toast('ルーチン（毎日）に登録しました');},
 del(){const id=$('f_id').value;ask('このタスクを削除しますか？',()=>{const day=S.days[view];S.runs=S.runs.filter(x=>x.id!==id);day.tasks=day.tasks.filter(t=>t.id!==id);save();closeSheet();render();});},
 carry(){const td=today(),d=dayW(td);let n=0;for(let i=14;i>=1;i--){const od=S.days[addDays(td,-i)];if(!od)continue;const mv=od.tasks.filter(t=>!t.start&&!t.routineId);od.tasks=od.tasks.filter(t=>!mv.includes(t));
   for(const t of mv){t.order=nextOrder(d);t.section=secAt(Date.now()).id;d.tasks.push(t);n++;}}save();render();toast(n+'件を今日へ移しました');},
 redit(d){routineSheet(d.id);},
 rgroup(d){ui.rgroup=d.g;saveUi();render();$('mn').scrollTop=0;},
 rhide(){ui.rhide=!ui.rhide;saveUi();render();},
 rsave(){const v=formVals();if(!v.name){toast('タスク名を入れてください');return;}const id=$('f_id').value;const type=$('f_type').value;
  const days=[...$('f_days').querySelectorAll('.on')].map(b=>+b.dataset.v);if(type==='weekly'&&!days.length){toast('曜日を選んでください');return;}
  const o=Object.assign(v,{type,days,active:$('f_active').checked});if(id)Object.assign(S.routines.find(r=>r.id===id),o);else S.routines.push(Object.assign({id:uid()},o));save();closeSheet();render();},
 rdel(){const id=$('f_id').value;ask('このルーチンを削除しますか？（過去の記録は残ります）',()=>{S.routines=S.routines.filter(r=>r.id!==id);save();closeSheet();render();});},
 range(d){range=d.r;render();},
 mdshare(){const m=markdown(view);if(window.Android&&Android.share)Android.share(m);else copy(m);},
 mdcopy(){copy(markdown(view));},
 mdsave(){saveFile('流帖_'+view+'.md','text/markdown',markdown(view));},
 secadd(){$('secl').insertAdjacentHTML('beforeend',`<div class="srow" data-id="${uid()}"><input placeholder="名前" data-k="name"><input type="time" value="12:00" data-k="start"><button data-act="rowdel">×</button></div>`);},
 rowdel(d,el){el.parentNode.remove();},
 secdel(d,el){if($('secl').children.length<=1){toast('セクションは1つ以上必要です');return;}el.parentNode.remove();},
 secsave(){const rows=[...$('secl').children].map(r=>({id:r.dataset.id,name:r.querySelector('[data-k=name]').value.trim(),start:r.querySelector('[data-k=start]').value})).filter(s=>s.name&&s.start);
  if(!rows.length){toast('セクションは1つ以上必要です');return;}S.settings.sections=rows;save();render();toast('保存しました');},
 prjadd(){$('prjl').insertAdjacentHTML('beforeend',`<div class="srow" data-id="${uid()}"><input placeholder="プロジェクト名" data-k="name"><input type="color" value="#3a5a78" data-k="color"><button data-act="rowdel">×</button></div>`);},
 prjdel(d,el){el.parentNode.remove();},
 prjsave(){S.projects=[...$('prjl').children].map(r=>({id:r.dataset.id,name:r.querySelector('[data-k=name]').value.trim(),color:r.querySelector('[data-k=color]').value})).filter(p=>p.name);save();render();toast('保存しました');},
 modadd(){$('modl').insertAdjacentHTML('beforeend',`<div class="srow" data-id="${uid()}"><input placeholder="モード名" data-k="name"><input type="color" value="#3a5a78" data-k="color"><button data-act="rowdel">×</button></div>`);},
 modsave(){S.modes=[...$('modl').children].map(r=>({id:r.dataset.id,name:r.querySelector('[data-k=name]').value.trim(),color:r.querySelector('[data-k=color]').value})).filter(p=>p.name);save();render();toast('保存しました');},
 drvlink(){manualSync=true;Android.linkFile('流帖_backup.json','application/json',JSON.stringify(S));},
 drvsave(){manualSync=true;toast('保存中…');Android.syncFile(JSON.stringify(S));},
 drvunlink(){ask('Googleドライブとの連携を解除しますか？（ドライブ上のファイルは残ります）',()=>{Android.unlink();render();});},
 backup(){saveFile('流帖_backup_'+today()+'.json','application/json',JSON.stringify(S,null,1));},
 restore(){$('file').value='';$('file').click();},
 csv(){saveFile('流帖_'+today()+'.csv','text/csv',csv());},
 wipe(){ask('すべてのデータを消去します。元に戻せません。よろしいですか？',()=>{S=defaults();save();view=today();render();toast('消去しました');});},
 askyes(){$('ask').classList.remove('on');const f=askCb;askCb=null;if(f)f();},
 askno(){$('ask').classList.remove('on');askCb=null;}
};
document.addEventListener('click',e=>{if(e.target===$('ovl')){closeSheet();return;}const el=e.target.closest('[data-act]');if(!el)return;const f=A[el.dataset.act];if(f)f(el.dataset,el);});
document.addEventListener('change',e=>{if(e.target.id==='optWrap'){S.settings.wrap=e.target.checked;save();render();return;}if(e.target.dataset.cal){const id=e.target.dataset.cal;const sk=(S.settings.calSkip||[]).filter(x=>x!==id);if(!e.target.checked)sk.push(id);S.settings.calSkip=sk;save();return;}if(e.target.dataset.rt){const r=S.routines.find(x=>x.id===e.target.dataset.rt);if(r){r.active=e.target.checked;save();const y=$('mn').scrollTop;render();$('mn').scrollTop=y;toast(r.active?'有効にしました':'停止しました');}return;}if(e.target.id==='optMulti'){S.settings.multi=e.target.checked;save();return;}if(e.target.id==='optPrev'){S.settings.startFromPrev=e.target.checked;save();return;}if(e.target.id==='autoSync'){S.settings.autoSync=e.target.checked;localStorage.setItem(KEY,JSON.stringify(S));return;}if(e.target.id==='dayStart'){S.settings.dayStart=+e.target.value;save();view=today();render();toast('保存しました');}});
document.addEventListener('input',e=>{if(e.target.id==='f_bulk')bulkPreview();});
$('ifile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{let t;const buf=new Uint8Array(r.result);
  try{t=new TextDecoder('utf-8',{fatal:true}).decode(buf);}catch(x){try{t=new TextDecoder('shift_jis').decode(buf);}catch(y){t=new TextDecoder().decode(buf);}}
  const ta=$('f_bulk');if(ta){ta.value=t;bulkPreview();}};r.readAsArrayBuffer(f);});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='f_name'){const b=$('sheet').querySelector('.btn.pri');if(b)b.click();}});
$('file').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j.days||!j.settings||!j.settings.sections)throw 0;
  ask('現在のデータをバックアップの内容で置き換えます。よろしいですか？',()=>{S=j;if(!S.modes)S.modes=defModes();if(!S.inbox)S.inbox=[];fixRuns(S);if(!S.routines)S.routines=[];if(!S.projects)S.projects=[];save();view=today();render();toast('復元しました');});}catch(x){toast('流帖のバックアップファイルではありません');}};r.readAsText(f);});
document.addEventListener('pointerdown',e=>{const h=e.target.closest('[data-hd]');if(!h)return;e.preventDefault();const row=h.closest('.task');drag={id:h.dataset.hd,row,k:null,rows:[],y:0};row.classList.add('drag');try{h.setPointerCapture(e.pointerId);}catch(x){}});
document.addEventListener('pointermove',e=>{if(!drag)return;e.preventDefault();const mn=$('mn'),r=mn.getBoundingClientRect();
  if(e.clientY<r.top+50)mn.scrollTop-=14;else if(e.clientY>r.bottom-50)mn.scrollTop+=14;
  const rows=[...mn.querySelectorAll('[data-row]')].filter(x=>x!==drag.row);rows.forEach(x=>x.classList.remove('dropb','dropa'));
  let k=rows.length;for(let i=0;i<rows.length;i++){const b=rows[i].getBoundingClientRect();if(e.clientY<b.top+b.height/2){k=i;break;}}
  drag.k=k;drag.rows=rows;drag.y=e.clientY;if(k<rows.length)rows[k].classList.add('dropb');else if(rows.length)rows[rows.length-1].classList.add('dropa');});
const endDrag=e=>{if(!drag)return;const d=drag;drag=null;const y=$('mn').scrollTop;if(e.type==='pointerup'&&d.k!=null&&d.rows.length)dropAt(d);render();$('mn').scrollTop=y;};
document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',endDrag);
window.onAndroidBack=()=>{if(sortMode&&tab==='today'&&!$('ovl').classList.contains('on')&&!$('ask').classList.contains('on')){sortMode=false;render();return true;}if($('ask').classList.contains('on')){A.askno();return true;}if($('ovl').classList.contains('on')){closeSheet();return true;}if(tab!=='today'){tab='today';render();return true;}if(view!==today()){view=today();render();return true;}return false;};
window.onAndroidMsg=m=>toast(m);
let manualSync=false;
window.onAndroidSync=ok=>{if(ok){localStorage.setItem(KEY+'.dirty','0');localStorage.setItem(KEY+'.sync',String(Date.now()));if(manualSync)toast('Googleドライブに保存しました');}
  else if(manualSync)toast('保存できませんでした。保存先を選び直してください');
  manualSync=false;if(tab==='setting'&&!$('ovl').classList.contains('on'))render();};
window.onAndroidPause=()=>{if(window.Android&&Android.linkName&&S.settings.autoSync!==false&&localStorage.getItem(KEY+'.dirty')==='1'&&Android.linkName())Android.syncFile(JSON.stringify(S));};

/* ---------- 時計 ---------- */
let lastDay=today(),lastMin=-1;
setInterval(()=>{if(drag)return;const td=today();if(td!==lastDay){if(view===lastDay)view=td;lastDay=td;render();return;}
  document.querySelectorAll('.estb').forEach(b=>{const e=+b.dataset.e;b.hidden=!(e&&Date.now()-+b.dataset.s>=e*60000);});
  document.querySelectorAll('.el[data-s]').forEach(el=>{const ms=Date.now()-+el.dataset.s,e=+el.dataset.e;el.textContent=hms(ms);el.classList.toggle('over',!!e&&ms>e*60000);});
  const m=new Date().getMinutes();if(m!==lastMin){lastMin=m;if(!$('ovl').classList.contains('on')&&tab==='today'){const y=$('mn').scrollTop;render();$('mn').scrollTop=y;}else renderHead();}
},1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!$('ovl').classList.contains('on'))render();});
render();
</script>
